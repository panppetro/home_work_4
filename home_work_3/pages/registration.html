 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home_work_3</title>
    <link rel="stylesheet" href="../styles/registration.css">
</head>
<body>
    <header> 
        <h1>
            Реєстрація
        </h1> 
    </header>
    <main>
       <nav>
        <ul>
            <li>
                <a href="articales.html">Статті</a>
            </li>
            <li>
                <a href="catalog.html">Каталог</a>
            </li>
            <li>
                <a href="contacts.html">Контакти</a>
            </li>
            <li>
                <a href="gallery.html">Галерея</a>
            </li>
            <li>
                <a href="page_nav.html">Навігація</a>
            </li>
            <li>
                <a href="../index.html">Головна сторінка</a>
            </li>
        </ul>
       </nav>
        <div class="form_group">
            <form method="get" action="https://mysite.Petro">
                <div>
                    <label for="first_name">Ім'я:</label>
                    <input id="first_name" type="text" placeholder="Enter first name">
                </div>
        
                <div>
                    <label for="surname">Прізвище:</label>
                    <input id="surname" type="text" placeholder="Enter surname">
                </div>
                    
                <div>
                    <button>Додати фотографію</button>
                </div>
        
                <div>
                <label for="email">Електрона пошта</label>
                <input id="email" type="email" placeholder="email">
                </div>
        
                <div>
                    <label for="password">Пароль</label>
                    <input id="password" type="password" placeholder="password">
                </div>
        
                <div>
                    <nav>
                        <a href="https://mysite.Petro">Сторінка сайту</a>
                    </nav>
                </div>
                    
                <div>
                    <label for="male">Стать:</label>
                    <select id="male" name="male">
                        <option value="man">Чоловік</option>
                    </select>
                </div>
        
                <div>
                    <label for="date">Дата народження:</label>
                    <input id="date" type="date" name="date">
                </div>
        
                <div>
                    <label for="kitchen">Вибрати кухню:</label>
                    <select id="kitchen" name="kitchen">
                        <option value="kitchen_1">Пательні</option>
                        <option value="kitchen_2">Сковорідка</option>
                        <option value="kitchen_3">Ложки</option>
                        <option value="kitchen_4">Виделки</option>
                    </select>
                </div>
        
                <div>
                    <label for="about_me">Про себе у довільній формі</label>
                    <textarea id="about_me" placeholder="text" rows="5" cols="33">
                        Про себе
                    </textarea>
                </div>
        
                <div>
                    <button type="submit">Зареєструатись</button>
                    <button type="reset">Очистити</button>
                </div>
                <div class="checkbox">
                    <label for="chexbox">Вибір:</label>
                    <input id="chexbox" type="checkbox" name="chexbox">
                </div>
             </form>
       </div>
    </main>
    <footer>
       &copy; 
    </footer>
</body>
</html>
